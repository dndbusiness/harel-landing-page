# פרמטרים לחשבון אחד. מעתיקים לתיקיית הלקוח (data/<לקוח>/params.yaml) וממלאים.
# כל מספר נכתב כמחרוזת ('1.76') כדי שלא ייקרא כ-float. כל ערך עם מקור ותאריך.

direct_channel_fee:
  rate: "1.76"              # ₪ לכל פעולה (י) בחודש הקלנדרי
  free_quota: 0
  source: "כיול מול שורות העמלה בהיסטוריה: 35→61.60, 45→79.20, 36→63.36"
  date: 2026-09-14
  calibrated_for: "חשבון הדוגמה בלבד — לכל לקוח ובנק מכיילים מחדש"

interest:
  # ריבית לא נגזרת מהדף. היועץ מזין מהודעת הבנק; המערכת מכיילת מול חיובי הריבית
  # שנרשמו בפועל ומציגה את אחוז הטעות. בלי שורות כאן — ההשפעה המשנית לא מחושבת.
  rates: []
  #  - from: 2026-01-01
  #    debit_annual_pct: "..."
  #    credit_annual_pct: "0"
  #    overlimit_annual_pct: "..."    # אופציונלי: מעבר למסגרת
  #    source: "הודעת ריבית מהבנק, תאריך"
  day_count: 365
  max_calibration_error_pct: "5"     # מעל זה הפלט מסומן "הערכה"
  forward_posting_months: [1, 4, 7, 10]   # מצב Forward בלבד: חודשי רישום הריבית

credit_limit:
  amount: null               # ₪, למשל "30000"
  source: ""
